<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PL22 - Virtual Racing League</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://i.postimg.cc/sgQbxyDm/PL22Logo.png">
    <link rel="apple-touch-icon" href="https://i.postimg.cc/sgQbxyDm/PL22Logo.png">
</head>
<body>
    <div class="container">
        <nav>
            <a href="index.html" class="logo">
                <img src="https://i.postimg.cc/sgQbxyDm/PL22Logo.png" alt="PL22 Logo" class="logo-image">
            </a>
            <div class="countdown-container" id="countdown-container" style="display: none;">
                <span class="countdown-label">NEXT RACE</span>
                <span class="countdown-timer" id="countdown-timer">--d --h --m</span>
            </div>
            
            <div class="nav-links">
                <a href="index.html">HOME</a>
                <a href="championship.html">CHAMPIONSHIP</a>
                <a href="results.html">RESULTS</a>
                <a href="stats.html">STATS</a>
                <a href="calendar.html">CALENDAR</a>
                <a href="teams.html">TEAMS</a>
                <a href="archive.html">ARCHIVE</a>
            </div>
        </nav>

        <div class="loading" id="loading">Loading PL22 season data...</div>

        <div id="content" style="display: none;">
            <div class="hero">
                <div class="hero-main">
                    <div class="hero-eyebrow" id="hero-eyebrow">Season 2</div>
                    <div class="hero-title" id="hero-title"></div>
                    <p class="hero-description" id="hero-description"></p>
                </div>
                <div class="hero-side" id="featured-driver"></div>
            </div>

            <div class="stats-grid" id="stats-grid"></div>

            <div class="news-grid" id="news-grid"></div>

            <div class="standings-section">
                <div class="section-header">
                    <h2 class="section-title">Driver Standings</h2>
                    <a href="championship.html" class="section-link">View full standings →</a>
                </div>
                <table class="standings-table" id="standings-table">
                    <thead>
                        <tr>
                            <th>Pos</th>
                            <th>Driver</th>
                            <th>Team</th>
                            <th>Points</th>
                        </tr>
                    </thead>
                    <tbody id="standings-body"></tbody>
                </table>
            </div>
        </div>

        <footer>
            <span>PL22 Virtual Racing League — Season 2</span>
            <div class="footer-links">
                <a href="#">About</a>
                <a href="#">Contact</a>
                <a href="#">Rules</a>
                <a href="#">Standings</a>
            </div>
        </footer>
    </div>

    <script src="js/data-loader.js"></script>
    <script src="js/main.js"></script>
    <script src="js/index.js"></script>
    <script src="js/countdown.js"></script>
</body>
</html>
